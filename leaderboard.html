<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Leaderboard</title>
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font --><style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* Changed background to a very dark purple/indigo color */
            background-color: #1a1538; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden; /* Hide scrollbars if particles go out of bounds */
            position: relative; /* Needed for particle canvas positioning */
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            /* Changed gradient to deep, dark purple shades */
            background-image: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); 
            z-index: 0; /* Behind other content */
        }
        #leaderboard-container {
            position: relative; /* Ensure leaderboard is above particles */
            z-index: 1;
        }
        #comeback-message {
            position: relative; /* Ensure message is above particles */
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Increased text shadow for better contrast against dark background */
        }
    </style>
</head>
<body class="antialiased">

    <!-- Particles.js container --><div id="particles-js"></div>

    <!-- Main Leaderboard Card --><div id="leaderboard-container" class="w-full max-w-xl bg-white p-4 sm:p-8 rounded-3xl shadow-2xl border-4 border-purple-600 transform hover:scale-[1.01] transition duration-300 ease-in-out">
        
        <!-- Header Section --><div class="text-center mb-6 sm:mb-8">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800 tracking-tight">
                <span class="text-purple-700">CTF</span> Leaderboard ✨
            </h1>
            <p class="mt-2 text-xl text-indigo-700 font-semibold">
                Contest Finished! Great Job, Hackers!
            </p>
        </div>

        <!-- Leaderboard List Header --><div class="flex justify-between items-center px-4 py-3 text-sm font-bold text-gray-600 border-b-2 border-gray-200">
            <div class="w-1/4 text-left">RANK</div>
            <div class="w-1/2 text-left">TEAM / USER</div>
            <div class="w-1/4 text-right">POINTS</div>
        </div>

        <!-- Leaderboard Items Container --><div id="leaderboard-list" class="space-y-3 mt-4">
            <!-- Leaderboard items will be injected here by JavaScript --></div>

        <!-- Footer Note --><div class="mt-8 text-center text-sm text-gray-500 pt-4 border-t border-gray-100">
            <p>Data provided by the CTF Score Engine.</p>
        </div>
    </div>

    <!-- "We Are Back soon with Bang" Message --><div id="comeback-message" class="absolute bottom-8 sm:bottom-12 text-center text-white text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-wide px-4">
        We Are Back soon with Bang! 💥 Thanks !
    </div>

    <!-- Particles.js library --><script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // --- Leaderboard Data ---
        const rawLeaderboardData = [
            // User-provided data
            { name: "Mikey", organization: "(Demo Users)", points: 7000 },
            { name: "Offline", organization: "", points: 7000 },
            { name: "Noname", organization: "(Demo Users)", points: 7000 },
            
            // Additional data for visual completeness
            { name: "RootKitten", organization: "(Solo)", points: 6850 },
            { name: "PandaSec", organization: "(School Team)", points: 6200 },
            { name: "BinaryBunny", organization: "", points: 5800 },
            { name: "TheFlagHunters", organization: "(Pro Squad)", points: 5500 },
            { name: "CyberGnome", organization: "", points: 5000 },
            { name: "CodeNinja", organization: "", points: 4900 },
            { name: "AnonMouse", organization: "(Newcomer)", points: 4500 },
        ];

        // Function to assign ranks and generate the HTML list item
        function renderLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = ''; // Clear existing content
            
            let currentRank = 1;
            rawLeaderboardData.forEach((item, index) => {
                if (index > 0 && item.points < rawLeaderboardData[index - 1].points) {
                    currentRank = index + 1;
                }
                
                let rankClass = 'text-gray-700 bg-gray-100';
                let medalIcon = currentRank;
                let nameClass = 'font-semibold text-gray-800';

                // We keep the medal colors standard (Gold/Silver/Bronze)
                if (currentRank === 1) {
                    rankClass = 'bg-yellow-400 text-gray-800 border-4 border-yellow-600';
                    medalIcon = '🥇';
                    nameClass = 'font-extrabold text-yellow-700';
                } else if (currentRank === 2) {
                    rankClass = 'bg-gray-300 text-gray-800 border-4 border-gray-400';
                    medalIcon = '🥈';
                    nameClass = 'font-extrabold text-gray-700';
                } else if (currentRank === 3) {
                    rankClass = 'bg-yellow-600/20 text-yellow-800 border-4 border-yellow-500/50';
                    medalIcon = '🥉';
                    nameClass = 'font-bold text-yellow-800';
                }
                
                const itemDiv = document.createElement('div');
                // Updated non-top-3 rows to use a slightly darker purple/hover effect for better overall feel
                itemDiv.className = `flex justify-between items-center p-3 rounded-xl shadow-md transition duration-200 ${currentRank <= 3 ? 'bg-white/90 transform scale-[1.02] border-2 border-dashed border-purple-300' : 'bg-purple-100/50 hover:bg-purple-200/80'}`;
                
                itemDiv.innerHTML = `
                    <div class="w-1/4 text-center">
                        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full text-lg ${rankClass} shadow-inner">
                            ${medalIcon}
                        </span>
                    </div>
                    <div class="w-1/2 text-left truncate">
                        <div class="${nameClass} text-base sm:text-lg leading-tight">
                            ${item.name}
                        </div>
                        <div class="text-xs text-gray-500 font-medium leading-none">
                            ${item.organization || '—'}
                        </div>
                    </div>
                    <div class="w-1/4 text-right">
                        <span class="text-xl sm:text-2xl font-bold text-purple-700">
                            ${item.points.toLocaleString()}
                        </span>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        // --- Particles.js Configuration ---
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    // Adjusted colors for better visibility on a dark background
                    "value": ["#ffffff", "#f0e4ff", "#d8b4fe"] 
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    },
                    "polygon": {
                        "nb_sides": 5
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    // Line color is now a lighter, vibrant purple for contrast
                    "color": "#a78bfa", 
                    "opacity": 0.6,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 3,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab" 
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push" 
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });

        // Run the rendering function when the window loads
        window.onload = renderLeaderboard;
    </script>
</body>
</html>
