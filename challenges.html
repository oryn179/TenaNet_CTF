<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENANET Leaderboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Cursor Style (as requested) */
        body {
            cursor: url('data:image/x-icon;base64,AAACAAEAICACAA8AAAAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAgAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAA+vr6AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP+AAAD/gAAA/4AAAf+AAAH/wAAD/8AAA//AAAf/4AAH/+AADv/gAB7/4AAe/2AAHP9gAADbQAAA2wAAABgAAAAYAAAAGAAAABgAAAAYAAAAGAAAABgAAAAAAA////////////////////////////////////////////8Af//+AD///gA///4AP//8AD///AAf//gAH//4AB//8AAP//AAD//gAA//wAAP/8AAD//AAA//4gAf//4AP///AP///8P////D////w////8P////D////w////+f/8='), auto;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrollbars due to particle canvas */
        }

        /* Particle Canvas Styling */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Place behind the content */
            opacity: 0.5; /* Slightly muted effect */
        }

        /* Custom glow for the Leaderboard card */
        .leaderboard-card {
            box-shadow: 0 0 50px rgba(109, 40, 217, 0.4); /* Purple glow effect */
            background: rgba(30, 2, 70, 0.9); /* Darker purple transparent background */
            backdrop-filter: blur(8px); /* Frosted glass effect */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Particle Background Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Leaderboard Container -->
    <div class="leaderboard-card w-full max-w-lg mx-auto rounded-3xl p-6 md:p-10 border border-indigo-700/50 relative z-10">

        <!-- Header -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-center mb-6 tracking-tight" style="color: #a78bfa;">
            TENANET CTF LEADERBOARD
        </h1>
        <p class="text-center text-indigo-300 mb-8 text-lg">
            Top Players of the CTF
        </p>

        <!-- Dynamic List of Scores -->
        <div id="scores-list" class="space-y-4">
            <!-- Rank 1: Gold -->
            <div class="flex items-center p-4 rounded-xl bg-yellow-900/50 border border-yellow-500/50 transform transition duration-300 hover:scale-[1.02]">
                <span class="text-xl font-bold w-10 text-center text-yellow-300">#1</span>
                <div class="flex-grow ml-4">
                    <div class="font-semibold text-yellow-100">Mikey <span class="text-sm opacity-70">(Demo Users)</span></div>
                    <div class="text-xs text-yellow-400">The Undefeated Champion</div>
                </div>
                <span class="text-2xl font-extrabold text-yellow-300">7,000</span>
            </div>

            <!-- Rank 2: Silver/Bronze (Tie) -->
            <div class="flex items-center p-4 rounded-xl bg-gray-800/50 border border-gray-500/50 transform transition duration-300 hover:scale-[1.02]">
                <span class="text-xl font-bold w-10 text-center text-gray-300">#2</span>
                <div class="flex-grow ml-4">
                    <div class="font-semibold text-gray-100">Noname <span class="text-sm opacity-70">(Demo Users)</span></div>
                    <div class="text-xs text-gray-400">The Silent Runner-Up</div>
                </div>
                <span class="text-2xl font-extrabold text-gray-300">7,000</span>
            </div>

            <!-- Rank 3: Regular Score -->
            <div class="flex items-center p-4 rounded-xl bg-indigo-900/40 border border-indigo-600/40 transform transition duration-300 hover:scale-[1.01]">
                <span class="text-lg font-medium w-10 text-center text-indigo-300">#3</span>
                <div class="flex-grow ml-4">
                    <div class="font-medium text-gray-100">Offline</div>
                    <div class="text-xs text-indigo-400">Last Seen: 2 Days Ago</div>
                </div>
                <span class="text-xl font-semibold text-indigo-300">700</span>
            </div>
            
            <!-- Additional filler entries to make it look like a full leaderboard -->
            <div class="flex items-center p-3 rounded-xl bg-gray-800/30 border border-transparent hover:bg-gray-700/40">
                <span class="w-10 text-center text-gray-400">#46</span>
                <div class="flex-grow ml-4 font-light text-gray-300">ShadowHunter</div>
                <span class="text-lg font-light text-gray-300">650</span>
            </div>
            <div class="flex items-center p-3 rounded-xl bg-gray-800/30 border border-transparent hover:bg-gray-700/40">
                <span class="w-10 text-center text-gray-400">#47</span>
                <div class="flex-grow ml-4 font-light text-gray-300">GamerTagPro</div>
                <span class="text-lg font-light text-gray-300">590</span>
            </div>
            <div class="flex items-center p-3 rounded-xl bg-gray-800/30 border border-transparent hover:bg-gray-700/40">
                <span class="w-10 text-center text-gray-400">#48</span>
                <div class="flex-grow ml-4 font-light text-gray-300">TheQuietOne</div>
                <span class="text-lg font-light text-gray-300">550</span>
            </div>
            
        </div>

        <!-- Footer Call to Action -->
        <div class="mt-8 text-center">
            <button class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition duration-200 transform hover:scale-[1.01] shadow-lg shadow-indigo-500/50">
                VIEW FULL RANKINGS
            </button>
        </div>

    </div>

    <script>
        // --- Particle Effect Script for Enhanced UI/UX ---

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // Set up the canvas size to match the window
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // Particle Class
        class Particle {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                // Fade out particle slowly
                this.alpha -= 0.005;
            }
        }

        // Initialization function
        function init() {
            particles = [];
            // Spawn initial particles across the screen
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 2 + 0.5;
                const color = Math.random() < 0.5 ? '#7c3aed' : '#a78bfa'; // Purple shades
                const velocity = {
                    x: (Math.random() - 0.5) * 0.2,
                    y: (Math.random() - 0.5) * 0.2
                };
                particles.push(new Particle(x, y, radius, color, velocity));
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            // Clear the canvas with a slight opacity for a trailing effect
            ctx.fillStyle = 'rgba(17, 24, 39, 0.2)'; // Faint trail
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0 && particle.radius > 0) {
                    particle.update();
                } else {
                    // Respawn the particle at a random edge once it fades out
                    const side = Math.floor(Math.random() * 4); // 0=top, 1=right, 2=bottom, 3=left
                    let x, y, vx, vy;
                    const radius = Math.random() * 2 + 0.5;
                    const speed = 0.2;

                    switch (side) {
                        case 0: // Top
                            x = Math.random() * canvas.width;
                            y = 0;
                            vx = (Math.random() - 0.5) * speed;
                            vy = Math.random() * speed;
                            break;
                        case 1: // Right
                            x = canvas.width;
                            y = Math.random() * canvas.height;
                            vx = -Math.random() * speed;
                            vy = (Math.random() - 0.5) * speed;
                            break;
                        case 2: // Bottom
                            x = Math.random() * canvas.width;
                            y = canvas.height;
                            vx = (Math.random() - 0.5) * speed;
                            vy = -Math.random() * speed;
                            break;
                        case 3: // Left
                            x = 0;
                            y = Math.random() * canvas.height;
                            vx = Math.random() * speed;
                            vy = (Math.random() - 0.5) * speed;
                            break;
                    }
                    
                    particles[index] = new Particle(x, y, radius, particles[index].color, { x: vx, y: vy });
                }
            });
        }

        // Start animation on window load
        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
